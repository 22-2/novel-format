name: Publish package on release tag

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Include dist in release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));if(p.scripts?.prepare){delete p.scripts.prepare;if(Object.keys(p.scripts).length===0)delete p.scripts;}fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git add -f dist
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): build for ${RELEASE_TAG}"
          fi
          git tag -f "${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}" --force

      - name: Package release assets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          zip -r "release-assets/novel-format-${RELEASE_TAG}-dist.zip" dist
          tar -czf "release-assets/novel-format-${RELEASE_TAG}-dist.tar.gz" -C . dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes release-assets/*
          fi
