name: Publish package on release tag

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package release assets
        run: |
          mkdir -p release-assets
          zip -r "release-assets/novel-format-${GITHUB_REF_NAME}-dist.zip" dist
          tar -czf "release-assets/novel-format-${GITHUB_REF_NAME}-dist.tar.gz" -C . dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes release-assets/*

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
